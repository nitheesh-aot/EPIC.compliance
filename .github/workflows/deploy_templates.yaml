name: Deploy and Update Template

on:
  push:
    branches:
      - develop
    paths:
      - 'compliance-api/src/compliance_api/templates/**'  # Only trigger on template changes

env:
  TEMPLATE_NAME: IR_TEMPLATE

jobs:
  deploy-and-patch_ir_template:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [dev, test, prod]
        include:
          - environment: dev
            api_host: docgen-api-c72cba-dev.apps.gold.devops.gov.bc.ca
          - environment: test
            api_host: docgen-api-c8b80a-test.apps.gold.devops.gov.bc.ca
          - environment: prod
            api_host: docgen-api-c8b80a-prod.apps.gold.devops.gov.bc.ca
    
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install html-minifier
        run: npm install -g html-minifier

      - name: Patch Template
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}  # You'll need to set this in your repository secrets
        run: |
          # Minify the template and escape quotes
          TEMPLATE_CONTENT=$(html-minifier \
            --collapse-whitespace \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            compliance-api/src/compliance_api/templates/ir_template.html | sed 's/"/\\"/g')
          
          # Make the API call to patch the template
          curl -X PATCH \
            "https://${{ matrix.api_host }}/api/templates/${TEMPLATE_NAME}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"template\":\"${TEMPLATE_CONTENT}\"}"

          echo "Template updated for ${{ matrix.environment }} environment"

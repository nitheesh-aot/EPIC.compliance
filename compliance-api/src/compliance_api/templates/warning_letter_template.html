<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Warning Letter</title>
    <style>
        /* Base styles */
        @font-face {
            font-family: 'Calibri';
            src: url('https://nrs.objectstore.gov.bc.ca/epic-static-assets/compliance-assets/fonts/calibri-regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Calibri';
            src: url('https://nrs.objectstore.gov.bc.ca/epic-static-assets/compliance-assets/fonts/calibri-italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'Calibri';
            src: url('https://nrs.objectstore.gov.bc.ca/epic-static-assets/compliance-assets/fonts/calibri-bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Calibri';
            src: url('https://nrs.objectstore.gov.bc.ca/epic-static-assets/compliance-assets/fonts/calibri-bold-italic.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }
        body {
            font-family: 'Calibri', 'BC Sans', sans-serif;
            margin: 0;
            padding: 0;
            font-size: 11pt;
            line-height: 12.75pt;
            color: #000000;
        }
        .header,
        .footer {
            text-align: left;
        }

        .letterhead {
            font-weight: bold;
        }

        .ref {
            margin-top: 1em;
            margin-bottom: 1em;
        }
        @media print {
            @page {
                size: letter;
                margin-top: 1.25in;
                margin-right: 0.5in;
                margin-bottom: 1in;
                margin-left: 0.75in;

                @top-left {
                    content: element(header);
                }

                @bottom-right {
                    content: element(footer);
                }

                counter-increment: page;
            }

            /* Page numbering */
            .pageNumber:before {
                content: counter(page);
            }

            .totalPages:before {
                content: counter(pages);
            }
        }

    </style>
</head>
<body>
    <div class="header">
        <p class="letterhead">{{office_name}}<br>
            {{office_branch}}</p>
        <p>
            Mailing Address:<br>
            {{address_line1}}<br>
            {{address_line2}}
        </p>
        <p>
            Location:<br>
            2nd Fl – 836 Yates St<br>
            Victoria BC V8W 1L8
        </p>
    </div>
    <div class="ref">
        <p><strong>Ref:</strong> {{ warning_letter_number }}<br>
            {{ issue_date }}<br>
            <strong>SENT VIA EMAIL</strong>
        </p>
    </div>
    <div class="content">
        {{content}}
    </div>
</body>
</html>

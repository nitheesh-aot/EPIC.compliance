app:
  name: compliance
  url: "https://compliance.eao.gov.bc.ca"
  api: https://compliance-api-c8b80a-prod.apps.gold.devops.gov.bc.ca
  env: dev
  auth_url: https://auth-api-c72cba-prod.apps.gold.devops.gov.bc.ca
  track_api_url: https://epictrack-api-c72cba-prod.apps.gold.devops.gov.bc.ca
  doc_service_url: https://epic-document-api-c8b80a-prod.apps.gold.devops.gov.bc.ca
  version: 1.0.0
  in_progress_features: []
  client_id: "epic-compliance"
aws:
  s3_bucket: "prod-epic-submit"
  s3_url: "https://nrs.objectstore.gov.bc.ca"
resources:
  cpu:
    limit: 200m
    request: 150m
  memory: 
    limit: 200Mi
    request: 100Mi
image:
  name: compliance-web
  tag: prod
  namespace: c8b80a-tools
  repository: image-registry.openshift-image-registry.svc:5000/c8b80a-tools
keycloak:
  url: "https://loginproxy.gov.bc.ca/auth/realms/eao-epic"
  client: epic-compliance
service:
  port: 8080
replicas:
  count: 1
mountPath: /usr/share/nginx/html/config/

